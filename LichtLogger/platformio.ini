; LichtLogger -- protokolliert Lichtausfaelle im Zelt (ESP32-C3 Super Mini + BH1750)
;   Misst dauernd (~40-60x/s), schreibt waehrend der Lichtzeit (04:00-24:00) nur Dunkel-Ereignisse
;   in eine CSV im internen Flash (LittleFS), Abruf ueber die Weboberflaeche.

[env:nologo_esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
upload_port = COM19
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
	claws/BH1750@^1.3.0
