; Multimodul auf RP2040-Zero (Waveshare)
;   Basis: Lueftermodul (4x PWM-Luefter + Tacho, Modbus-RTU 0x51).
;   Zusaetzlich I2C1 (SDA=10/SCL=11): optional SCD41+AS7341 (wie Multisensor, Adresse 0x20)
;   und GP8403 0-10V-DAC (wie Analogmodul, Adresse 0x50) -- Erkennung per I2C-Scan beim Boot.
; Nutzt den earlephilhower arduino-pico Core (nicht mbed).

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = dfu
; LittleFS-Bereich fuer das Firmware-Update ueber RS485 (siehe src/fw_update.cpp): das neue
; Image wird dort zwischengespeichert, bevor der OTA-Bootloader es beim Neustart uebernimmt --
; muss groesser sein als die Firmware selbst (aktuell ~75 KB).
board_build.filesystem_size = 0.5m

lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	adafruit/Adafruit AS7341
	adafruit/Adafruit BusIO
	sensirion/Sensirion I2C SCD4x
