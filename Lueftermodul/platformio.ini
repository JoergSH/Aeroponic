; RS485-Lueftermodul auf RP2040-Zero (Waveshare)
;   4x PWM-Ausgang (25 kHz) fuer PC-Luefter + 4x Tacho-Eingang, Modbus-RTU-Slave.
; Nutzt den earlephilhower arduino-pico Core (nicht mbed).

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = dfu

lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
